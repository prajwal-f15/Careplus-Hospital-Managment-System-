<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login - CarePulse Hospital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-sky-50 via-slate-50 to-teal-50 min-h-screen flex flex-col justify-between">

  <!-- Simple Header -->
  <header class="py-6 px-4 sm:px-8 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-600 to-teal-500 flex items-center justify-center text-white shadow-md">
        <i data-lucide="cross" class="w-5 h-5 stroke-[2.5]"></i>
      </div>
      <span class="text-xl font-black text-slate-900">Care<span class="text-sky-600">Pulse</span></span>
    </a>
    <a href="register.html" class="text-xs font-bold text-sky-600 hover:underline">New Patient? Register</a>
  </header>

  <!-- Login Card Container -->
  <main class="max-w-md w-full mx-auto px-4 py-8">
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black text-slate-900">Welcome Back</h1>
        <p class="text-xs text-slate-500">Sign in to access your role-based hospital dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="email" id="login-email" required placeholder="name@example.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-slate-50 focus:bg-white transition">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-slate-700">Password</label>
            <a href="forgot-password.html" class="text-[11px] font-medium text-sky-600 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-slate-50 focus:bg-white transition">
          </div>
        </div>

        <button type="submit" id="login-btn" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow-md shadow-sky-600/20 transition flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Account
        </button>
      </form>

      <div class="text-center pt-2 border-t border-slate-100">
        <p class="text-xs text-slate-500">
          Don't have an account? <a href="register.html" class="font-bold text-sky-600 hover:underline">Register here</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400">
    &copy; 2026 CarePulse Central Hospital. All rights reserved.
  </footer>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    // Check if redirect query param exists
    const urlParams = new URLSearchParams(window.location.search);
    const redirectPath = urlParams.get('redirect');

    // Regular Form Submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      try {
        const user = await window.Auth.login(email, pass);
        window.showToast(`Welcome back, ${user.full_name}!`, 'success');
        setTimeout(() => {
          if (redirectPath) window.location.href = redirectPath;
          else window.Auth.redirectDashboard(user.role);
        }, 700);
      } catch (err) {
        window.showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In to Account';
      }
    });
  </script>
</body>
</html>
