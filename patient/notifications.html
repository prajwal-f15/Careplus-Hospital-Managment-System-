<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - CarePulse Hospital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

  <!-- PATIENT NAVBAR -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-600 to-teal-500 flex items-center justify-center text-white shadow-md">
            <i data-lucide="cross" class="w-5 h-5 stroke-[2.5]"></i>
          </div>
          <div>
            <span class="text-lg font-black text-slate-900">Care<span class="text-sky-600">Pulse</span></span>
            <span class="block text-[10px] uppercase font-bold tracking-widest text-sky-700">Patient Portal</span>
          </div>
        </a>

        <nav class="hidden md:flex items-center gap-6 text-xs font-bold text-slate-600">
          <a href="index.html" class="hover:text-sky-600 flex items-center gap-1.5 transition"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
          <a href="book-appointment.html" class="hover:text-sky-600 flex items-center gap-1.5 transition"><i data-lucide="calendar-plus" class="w-4 h-4"></i> Book Appointment</a>
          <a href="appointments.html" class="hover:text-sky-600 flex items-center gap-1.5 transition"><i data-lucide="calendar" class="w-4 h-4"></i> My Appointments</a>
          <a href="queue-status.html" class="hover:text-sky-600 flex items-center gap-1.5 transition"><i data-lucide="activity" class="w-4 h-4"></i> Live Queue</a>
          <a href="notifications.html" class="text-sky-600 flex items-center gap-1.5"><i data-lucide="bell" class="w-4 h-4"></i> Notifications</a>
          <a href="profile.html" class="hover:text-sky-600 flex items-center gap-1.5 transition"><i data-lucide="user" class="w-4 h-4"></i> Profile</a>
        </nav>

        <div id="nav-auth-section" class="flex items-center gap-3"></div>
      </div>
    </div>
  </header>

  <main class="flex-grow py-8 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-black text-slate-900">Notifications Center</h1>
        <p class="text-xs text-slate-500 mt-0.5">Real-time alerts regarding appointment confirmations, tokens, and schedule updates.</p>
      </div>

      <button onclick="window.CarePulseDB.markAllNotificationsAsRead(window.Auth.getCurrentUser().id).then(() => { window.showToast('All notifications marked as read', 'info'); window.PatientApp.initNotifications(); })" class="px-3.5 py-1.5 text-xs font-semibold text-sky-600 hover:bg-sky-50 rounded-xl transition border border-sky-200">
        Mark All as Read
      </button>
    </div>

    <!-- Notification Cards List Container (rendered by patient.js) -->
    <div id="patient-notifications-container" class="space-y-3">
      <div class="p-12 text-center text-xs text-slate-400">Loading notifications...</div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    &copy; 2026 CarePulse Central Hospital. All rights reserved.
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/patient.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.Auth.requireAuth(['patient']);
    });
  </script>
</body>
</html>
