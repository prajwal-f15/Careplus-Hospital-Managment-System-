<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - CarePulse Hospital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-sky-50 via-slate-50 to-teal-50 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="py-6 px-4 sm:px-8 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-600 to-teal-500 flex items-center justify-center text-white shadow-md">
        <i data-lucide="cross" class="w-5 h-5 stroke-[2.5]"></i>
      </div>
      <span class="text-xl font-black text-slate-900">Care<span class="text-sky-600">Pulse</span></span>
    </a>
  </header>

  <!-- Reset Password Card Container -->
  <main class="max-w-md w-full mx-auto px-4 py-8">
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto shadow-inner">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900">Set New Password</h1>
        <p class="text-xs text-slate-500">Please choose a strong, secure password for your account.</p>
      </div>

      <!-- Form -->
      <form id="reset-password-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="password" id="new-password" required minlength="6" placeholder="At least 6 characters" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-slate-50 focus:bg-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Confirm New Password</label>
          <div class="relative">
            <i data-lucide="check" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="password" id="confirm-password" required minlength="6" placeholder="Repeat new password" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-slate-50 focus:bg-white">
          </div>
        </div>

        <button type="submit" id="save-pass-btn" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow-md shadow-sky-600/20 transition flex items-center justify-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i> Update Password
        </button>
      </form>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400">
    &copy; 2026 CarePulse Central Hospital. All rights reserved.
  </footer>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;
      const btn = document.getElementById('save-pass-btn');

      if (p1 !== p2) {
        window.showToast('Passwords do not match! Please check again.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Updating Password...';
      lucide.createIcons();

      try {
        await window.Auth.updatePassword(p1);
        window.showToast('Password updated successfully! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } catch (err) {
        window.showToast(err.message || 'Error updating password.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Update Password';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
