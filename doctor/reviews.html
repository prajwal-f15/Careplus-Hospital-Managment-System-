<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Reviews - CarePulse Hospital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

  <!-- DOCTOR NAVBAR -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-600 to-sky-600 flex items-center justify-center text-white shadow-md">
            <i data-lucide="cross" class="w-5 h-5 stroke-[2.5]"></i>
          </div>
          <div>
            <span class="text-lg font-black text-slate-900">Care<span class="text-teal-600">Pulse</span></span>
            <span class="block text-[10px] uppercase font-bold tracking-widest text-teal-700">Doctor Portal</span>
          </div>
        </a>

        <nav class="hidden md:flex items-center gap-6 text-xs font-bold text-slate-600">
          <a href="index.html" class="hover:text-teal-600 flex items-center gap-1.5 transition"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
          <a href="appointments.html" class="hover:text-teal-600 flex items-center gap-1.5 transition"><i data-lucide="calendar" class="w-4 h-4"></i> Appointments</a>
          <a href="schedule.html" class="hover:text-teal-600 flex items-center gap-1.5 transition"><i data-lucide="clock" class="w-4 h-4"></i> Schedule</a>
          <a href="patients.html" class="hover:text-teal-600 flex items-center gap-1.5 transition"><i data-lucide="users" class="w-4 h-4"></i> Patients</a>
          <a href="reviews.html" class="text-teal-600 flex items-center gap-1.5"><i data-lucide="star" class="w-4 h-4"></i> Reviews</a>
          <a href="profile.html" class="hover:text-teal-600 flex items-center gap-1.5 transition"><i data-lucide="user" class="w-4 h-4"></i> Profile</a>
        </nav>

        <div id="nav-auth-section" class="flex items-center gap-3"></div>
      </div>
    </div>
  </header>

  <main id="doctor-reviews-view" class="flex-grow py-8 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full space-y-6">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900">Patient Feedback & 5-Star Ratings</h1>
      <p class="text-xs text-slate-500 mt-0.5">Reviews submitted by patients following completed clinical consultations.</p>
    </div>

    <!-- Reviews List Container (rendered by doctor.js) -->
    <div id="doctor-reviews-list" class="space-y-4">
      <div class="p-12 text-center text-xs text-slate-400">Loading patient feedback...</div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    &copy; 2026 CarePulse Central Hospital. All rights reserved.
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/doctor.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.Auth.requireAuth(['doctor']);
    });
  </script>
</body>
</html>
