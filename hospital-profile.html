<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Profile - CarePulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Leaflet CSS & JS for Interactive Map (Module 5) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-600 to-teal-500 flex items-center justify-center text-white shadow-md">
            <i data-lucide="cross" class="w-6 h-6 stroke-[2.5]"></i>
          </div>
          <div>
            <span class="text-xl font-black text-slate-900">Care<span class="text-sky-600">Pulse</span></span>
            <span class="block text-[10px] uppercase font-bold tracking-widest text-slate-400">Hospital Portal</span>
          </div>
        </a>

        <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
          <a href="index.html" class="hover:text-sky-600 transition">Home</a>
          <a href="doctors.html" class="hover:text-sky-600 transition">Find Doctors</a>
          <a href="hospitals.html" class="text-sky-600 font-bold">Hospitals</a>
          <a href="departments.html" class="hover:text-sky-600 transition">Departments</a>
          <a href="about.html" class="hover:text-sky-600 transition">About Us</a>
          <a href="contact.html" class="hover:text-sky-600 transition">Contact</a>
        </nav>

        <div id="nav-auth-section" class="flex items-center gap-3"></div>
      </div>
    </div>
  </header>

  <main class="flex-grow py-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
    <!-- Breadcrumb -->
    <div class="mb-4 flex items-center gap-2 text-xs text-slate-500">
      <a href="index.html" class="hover:text-sky-600">Home</a>
      <span>/</span>
      <a href="hospitals.html" class="hover:text-sky-600">Hospitals</a>
      <span>/</span>
      <span id="breadcrumb-hospital-name" class="font-bold text-slate-800">Hospital Details</span>
    </div>

    <div id="hospital-profile-content" class="space-y-8">
      <!-- Loading Placeholder -->
      <div class="p-12 text-center text-xs text-slate-400">Loading hospital profile details...</div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-8 text-center text-xs text-slate-400">
    &copy; 2026 CarePulse Central Hospital. All rights reserved.
  </footer>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/location.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const hospitalId = urlParams.get('id');

      const contentEl = document.getElementById('hospital-profile-content');
      const breadcrumbEl = document.getElementById('breadcrumb-hospital-name');

      const loadHospitalProfile = async () => {
        const hospitals = await window.CarePulseDB.getHospitals();
        const hosp = hospitals.find(h => h.id === hospitalId) || hospitals[0];

        if (!hosp) {
          contentEl.innerHTML = `
            <div class="bg-white p-12 rounded-3xl text-center space-y-3">
              <h3 class="font-bold text-slate-800">Hospital not found</h3>
              <a href="hospitals.html" class="text-sky-600 font-bold text-xs inline-block">← Back to Hospitals Directory</a>
            </div>
          `;
          return;
        }

        breadcrumbEl.textContent = hosp.name;

        // Fetch Departments & Doctors associated with this hospital (Module 5)
        const [departments, associatedDoctors] = await Promise.all([
          window.CarePulseDB.getDepartments(),
          window.CarePulseDB.getHospitalDoctors(hosp.id)
        ]);

        const facilitiesList = Array.isArray(hosp.facilities) 
          ? hosp.facilities 
          : (typeof hosp.facilities === 'string' ? JSON.parse(hosp.facilities || '[]') : []);

        const activeLoc = window.LocationService ? window.LocationService.getActiveDiscoveryLocation() : null;
        let distanceInfo = '';
        if (activeLoc && activeLoc.latitude && hosp.latitude && window.LocationService) {
          const dist = window.LocationService.calculateDistance(activeLoc.latitude, activeLoc.longitude, hosp.latitude, hosp.longitude);
          distanceInfo = `<span class="inline-flex items-center gap-1 text-sky-600 font-bold"><i data-lucide="navigation" class="w-3.5 h-3.5"></i> ${dist} km from current location</span>`;
        }

        contentEl.innerHTML = `
          <!-- Top Hero Banner Card -->
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="relative h-64 sm:h-80 bg-slate-900">
              <img src="${hosp.cover_image || 'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=1200'}" alt="${hosp.name}" class="w-full h-full object-cover opacity-80">
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/30 to-transparent"></div>
              
              <div class="absolute top-4 left-4 flex items-center gap-2">
                <span class="px-3 py-1 rounded-full text-xs font-bold bg-white/95 text-slate-900 shadow-sm">
                  ${hosp.hospital_type || 'Super-specialty'}
                </span>
                ${hosp.verification_status === 'approved' ? `
                  <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500 text-white flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> Admin Verified Hospital
                  </span>
                ` : ''}
              </div>

              <div class="absolute bottom-6 left-6 right-6 flex flex-col sm:flex-row items-start sm:items-end justify-between gap-4 text-white">
                <div class="flex items-center gap-4">
                  <img src="${hosp.logo_url || 'https://images.unsplash.com/photo-1516549655169-df83a0774514?w=400'}" alt="${hosp.name}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border-4 border-white/20 shadow-xl shrink-0">
                  <div>
                    <h1 class="text-2xl sm:text-3xl font-black">${hosp.name}</h1>
                    <p class="text-xs sm:text-sm text-slate-200 mt-1 flex items-center gap-1.5">
                      <i data-lucide="map-pin" class="w-4 h-4 text-sky-400"></i> ${hosp.address || 'Civil Lines'}, ${hosp.city_name || 'Maharashtra'} &bull; PIN: ${hosp.pincode || '400001'}
                    </p>
                  </div>
                </div>

                <div class="flex flex-wrap items-center gap-3">
                  ${hosp.emergency_phone ? `
                    <a href="tel:${hosp.emergency_phone}" class="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow-lg transition flex items-center gap-2">
                      <i data-lucide="ambulance" class="w-4 h-4"></i> Emergency: ${hosp.emergency_phone}
                    </a>
                  ` : ''}
                  <a href="#associated-doctors-section" class="px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-lg transition flex items-center gap-2">
                    <i data-lucide="stethoscope" class="w-4 h-4"></i> Book Doctor
                  </a>
                </div>
              </div>
            </div>

            <!-- Licensing & Meta Strip -->
            <div class="p-6 bg-slate-50/70 border-t border-slate-200 flex flex-wrap items-center justify-between gap-4 text-xs text-slate-600">
              <div class="flex flex-wrap items-center gap-6">
                <span><strong>License:</strong> ${hosp.license_number || 'LIC-DHS-2024'}</span>
                <span><strong>Reg #:</strong> ${hosp.registration_number || 'REG-MH-2024'}</span>
                <span><strong>Beds:</strong> ${hosp.total_beds || 150}+ Inpatient Beds</span>
                ${distanceInfo}
              </div>
              <div class="flex items-center gap-4 text-xs">
                <span><i data-lucide="mail" class="w-3.5 h-3.5 inline text-slate-400"></i> ${hosp.email || 'info@carepulse.hospital'}</span>
                <span><i data-lucide="phone" class="w-3.5 h-3.5 inline text-slate-400"></i> ${hosp.phone || '+91 22 2600 0000'}</span>
              </div>
            </div>
          </div>

          <!-- Grid: Hospital Location Map + Facilities -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left 2 Cols: Departments, Facilities, Map -->
            <div class="lg:col-span-2 space-y-8">
              <!-- Clinical Departments & Medical Specialties -->
              <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 space-y-4">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="layers" class="w-5 h-5 text-sky-600"></i> Clinical Departments & Specialties
                  </h3>
                  <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2.5 py-1 rounded-full border border-sky-100">${departments.length} Medical Units</span>
                </div>
                <p class="text-xs text-slate-500">Certified clinical medical departments and specialist consultation wings active at this facility:</p>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                  ${departments.map(dept => {
                    const deptDocs = associatedDoctors.filter(d => d.department_id === dept.id || d.department_name === dept.name);
                    return `
                      <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 hover:border-sky-300 transition flex items-start gap-3 group">
                        <div class="w-9 h-9 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center shrink-0 group-hover:scale-105 transition">
                          <i data-lucide="${dept.icon || 'activity'}" class="w-4 h-4"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                          <div class="flex items-center justify-between gap-1">
                            <h4 class="text-xs font-bold text-slate-900 truncate">${dept.name}</h4>
                            <span class="font-mono text-[10px] font-bold text-sky-700 bg-white border border-sky-200 px-1.5 py-0.5 rounded">${dept.code}</span>
                          </div>
                          <p class="text-[11px] text-slate-500 line-clamp-1 mt-0.5">${dept.description}</p>
                          <div class="mt-2 pt-1.5 border-t border-slate-200/60 flex items-center justify-between text-[11px]">
                            <span class="text-slate-400 text-[10px]"><i data-lucide="door-open" class="w-3 h-3 inline"></i> ${dept.room_number || 'OPD'}</span>
                            <a href="doctors.html?dept=${encodeURIComponent(dept.id)}" class="font-bold text-sky-600 hover:text-sky-800 text-[11px]">
                              ${deptDocs.length > 0 ? `${deptDocs.length} Specialists →` : 'View Doctors →'}
                            </a>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Accredited Infrastructure & Emergency Facilities -->
              <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 space-y-4">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                  <i data-lucide="shield-plus" class="w-5 h-5 text-emerald-600"></i> Accredited Infrastructure & Emergency Facilities
                </h3>
                <p class="text-xs text-slate-500">Certified infrastructure, emergency critical care, and diagnostic support available at this location:</p>
                
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2">
                  ${facilitiesList.map(f => `
                    <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center gap-2.5">
                      <div class="w-7 h-7 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0">
                        <i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>
                      </div>
                      <span class="text-xs font-semibold text-slate-800">${f}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Interactive Location Map (Module 5) -->
              <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 space-y-4">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="map" class="w-5 h-5 text-sky-600"></i> Location & GPS Coordinates
                  </h3>
                  <span class="text-xs font-bold text-slate-400">
                    Lat: ${Number(hosp.latitude || 19.076).toFixed(4)}, Lng: ${Number(hosp.longitude || 72.877).toFixed(4)}
                  </span>
                </div>
                <div id="hospital-map" class="w-full h-72 rounded-2xl border border-slate-200 overflow-hidden shadow-inner"></div>
                <p class="text-[11px] text-slate-500">
                  Exact location coordinates registered with CarePulse Health Directory. Use for navigation and cross-city ambulance transit.
                </p>
              </div>
            </div>

            <!-- Right 1 Col: Hospital Information Sidebar -->
            <div class="space-y-6">
              <div class="bg-white rounded-3xl p-6 border border-slate-200 space-y-4">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Hospital Administration</h3>
                
                <div class="space-y-3 text-xs">
                  <div>
                    <span class="text-slate-400 block text-[10px] uppercase font-bold">Authorized Signatory</span>
                    <span class="font-bold text-slate-800">${hosp.authorized_person_name || 'Medical Director'}</span>
                    <span class="text-slate-500 block text-[11px]">${hosp.authorized_person_designation || 'Chief Medical Officer'}</span>
                  </div>

                  <div class="pt-2 border-t border-slate-100">
                    <span class="text-slate-400 block text-[10px] uppercase font-bold">General Reception</span>
                    <span class="font-semibold text-slate-800">${hosp.phone || '+91 22 2600 0000'}</span>
                  </div>

                  <div class="pt-2 border-t border-slate-100">
                    <span class="text-slate-400 block text-[10px] uppercase font-bold">24x7 Emergency Line</span>
                    <span class="font-bold text-rose-600">${hosp.emergency_phone || '+91 22 2600 0099'}</span>
                  </div>

                  <div class="pt-2 border-t border-slate-100">
                    <span class="text-slate-400 block text-[10px] uppercase font-bold">Official Website</span>
                    <a href="${hosp.website || '#'}" target="_blank" class="font-semibold text-sky-600 hover:underline break-all">
                      ${hosp.website || 'https://carepulse.hospital'}
                    </a>
                  </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                  <a href="doctors.html?city=${encodeURIComponent(hosp.city_name || 'Mumbai')}" class="w-full block py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold text-center transition">
                    Find All Doctors in ${hosp.city_name || 'This City'} →
                  </a>
                </div>
              </div>
            </div>
          </div>

          <!-- Associated Doctors Section (Module 5) -->
          <div id="associated-doctors-section" class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 space-y-6">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                  <i data-lucide="stethoscope" class="w-5 h-5 text-sky-600"></i> Associated Specialists & Doctors
                </h3>
                <p class="text-xs text-slate-500 mt-0.5">Approved medical consultants practicing at this hospital location:</p>
              </div>
              <span class="text-xs font-bold px-3 py-1 rounded-full bg-sky-50 text-sky-700 border border-sky-100">
                ${associatedDoctors.length} Active Specialist${associatedDoctors.length === 1 ? '' : 's'}
              </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${associatedDoctors.map(doc => `
                <div class="p-5 rounded-2xl border border-slate-200 bg-slate-50/60 flex flex-col justify-between space-y-4 hover:shadow-md transition">
                  <div class="space-y-3">
                    <div class="flex items-start gap-3">
                      <img src="${doc.profile_image}" class="w-14 h-14 rounded-2xl object-cover border-2 border-white shadow-sm shrink-0">
                      <div>
                        <h4 class="font-bold text-sm text-slate-900 leading-snug">
                          <a href="doctor-profile.html?id=${doc.id}" class="hover:text-sky-600 transition">${doc.full_name}</a>
                        </h4>
                        <p class="text-xs text-sky-600 font-medium">${doc.specialization}</p>
                        <p class="text-[11px] text-slate-400">${doc.qualification}</p>
                      </div>
                    </div>

                    <div class="flex items-center justify-between text-xs text-slate-600 pt-2 border-t border-slate-200/60">
                      <span class="flex items-center gap-1"><i data-lucide="briefcase" class="w-3.5 h-3.5 text-slate-400"></i> ${doc.experience_years}+ Yrs</span>
                      <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i> ${doc.room_number || 'Room 101'}</span>
                      <span class="font-bold text-slate-900">$${doc.consultation_fee || doc.fee || 50}</span>
                    </div>
                  </div>

                  <div class="pt-3 border-t border-slate-200 flex items-center gap-2">
                    <a href="doctor-profile.html?id=${doc.id}" class="flex-1 py-2 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-bold rounded-xl transition text-center shadow-sm">
                      Profile
                    </a>
                    <a href="patient/book-appointment.html?doctorId=${doc.id}&hospitalId=${hosp.id}" class="flex-1 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-xl transition text-center shadow-sm">
                      Book Slot
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        if (window.lucide) window.lucide.createIcons();

        // Initialize Leaflet Map (Module 5)
        setTimeout(() => {
          const mapContainer = document.getElementById('hospital-map');
          if (mapContainer && typeof L !== 'undefined') {
            const lat = Number(hosp.latitude) || 19.0760;
            const lng = Number(hosp.longitude) || 72.8777;

            const map = L.map('hospital-map').setView([lat, lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const marker = L.marker([lat, lng]).addTo(map);
            marker.bindPopup(`
              <div class="p-1 text-xs">
                <strong class="text-sm font-bold block text-slate-900">${hosp.name}</strong>
                <span class="text-slate-600 block mt-1">${hosp.address || 'Medical Center'}</span>
                ${hosp.emergency_phone ? `<span class="text-rose-600 font-bold block mt-1">24x7 Emergency: ${hosp.emergency_phone}</span>` : ''}
              </div>
            `).openPopup();
          }
        }, 100);
      };

      await loadHospitalProfile();
    });
  </script>
</body>
</html>
